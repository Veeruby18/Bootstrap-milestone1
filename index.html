<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="btn-danger main-header">
      <div class="container-fluid px-3">
        <div
          class="row d-lg-flex align-items-end align-items-lg-center main-header"
        >
          <div class="col">
            <p class="mb-0 d-none d-lg-block date">Wed, Jan 20, 2021</p>

            <a
              href="#"
              class="text-decoration-none text-light fw-bold d-block d-lg-none news-sm"
              >Newsweek</a
            >
          </div>

          <div class="col text-center d-none d-lg-block">
            <a
              href="#"
              class="text-decoration-none text-light fw-bold news-logo"
              >Newsweek</a
            >
          </div>

          <div class="col d-flex justify-content-end align-items-center gap-3">
            <a href="#" aria-label="User account" class="d-md-none">
              <i class="fa-solid fa-user text-light bars"></i>
            </a>
            <a
              href="#"
              class="d-none d-md-block text-light text-decoration-none profile"
              >Login</a
            >
            <a href="#" class="btn btn-warning rounded-pill sub"
              >Subscribe <i class="fa-solid fa-angle-right"></i>
            </a>
            <a href="#" aria-label="Open menu" class="text-decoration-none">
              <i class="fa-solid fa-bars text-light bars d-lg-none"></i>
            </a>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
